version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: todoapp-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: todoapp123
      MONGO_INITDB_DATABASE: todoapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - todoapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todoapp-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://root:todoapp123@mongodb:27017/todoapp?authSource=admin
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - todoapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todoapp-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - todoapp-network

volumes:
  mongodb_data:

networks:
  todoapp-network:
    driver: bridge
